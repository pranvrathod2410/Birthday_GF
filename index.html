<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow-x: hidden;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h1 {
    color: #ff4d6d;
}

#countdown {
    font-size: 28px;
    margin: 20px 0;
    font-weight: bold;
}

.hidden {
    display: none;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
}

.gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 15px;
}

button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    background: #ff4d6d;
    color: white;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
}

/* Floating hearts */
.heart {
    position: fixed;
    bottom: -10px;
    color: red;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    0% {transform: translateY(0); opacity: 1;}
    100% {transform: translateY(-100vh); opacity: 0;}
}
</style>
</head>

<body>

<div class="container">

<h1>Something Special is Coming 💖</h1>

<div id="countdown"></div>

<div id="surprise" class="hidden">
    <h1>Happy Midnight My Love ❤️</h1>
    <p>
        The clock hit 12, but my love for you has no time.<br>
        You are my happiness, my peace, my everything 💖
    </p>

    <audio id="music" loop>
        <source src="music.mp3.mpeg" type="audio/mpeg">
    </audio>

    <button onclick="playMusic()">Play Music 🎵</button>

    <div class="gallery">
        <img src="photo1.jpg.jpg">
        <img src="photo2.jpg.jpg">
        <img src="photo3.jpg.jpg">
        <img src="photo4.jpg.jpg">
    </div>
</div>

</div>

<script>
// Countdown to next 12 AM
function getMidnight() {
    const now = new Date();
    const midnight = new Date();
    midnight.setHours(24,0,0,0);
    return midnight;
}

function updateCountdown() {
    const now = new Date();
    const diff = getMidnight() - now;

    if (diff <= 0) {
        document.getElementById("countdown").style.display = "none";
        document.getElementById("surprise").classList.remove("hidden");
        startHearts();
        return;
    }

    const h = Math.floor(diff / (1000 * 60 * 60));
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").innerText =
        `${h}h ${m}m ${s}s left`;
}

setInterval(updateCountdown, 1000);

// Music
function playMusic() {
    document.getElementById("music").play();
}

// Hearts animation
function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerText = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 10) + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }, 300);
}
</script>

</body>
</html>
