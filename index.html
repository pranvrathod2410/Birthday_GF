<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>For My Love ❤️</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            color: #333;
        }
        h1 {
            margin-top: 20px;
            font-size: 40px;
        }
        p {
            font-size: 20px;
            padding: 0 20px;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }
        .gallery img {
            width: 250px;
            height: 180px;
            object-fit: cover;
            margin: 10px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
        footer {
            margin: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>For My Beautiful Girlfriend 💖</h1>

    <p>
        Every moment with you feels like a dream.  
        You make my world brighter, happier, and full of love.  
        I'm so lucky to have you in my life ❤️
    </p>

    <!-- Music -->
    <audio autoplay loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Photo Gallery -->
    <div class="gallery">
        <img src="photo1.jpg" alt="Memory 1">
        <img src="photo2.jpg" alt="Memory 2">
        <img src="photo3.jpg" alt="Memory 3">
        <img src="photo4.jpg" alt="Memory 4">
    </div>

    <footer>
        Made with ❤️ just for you
    </footer>

</body>
</html>
